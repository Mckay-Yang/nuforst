[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "nufrost_py"
version = "0.1.0"
description = "NUFROST time-series reconstruction — Rust-backed Python module"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "nufrost_py"
bindings = "pyo3"
