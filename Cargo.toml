[workspace]
resolver = "2"
members = [
    "crates/nufrost-core",
    "crates/nufrost-gdal",
    "crates/nufrost-cli",
    "crates/nufrost-py",
]

[workspace.dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"] }
numpy = "0.24"
maturin = "1"
gdal = "0.19"
regex = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
